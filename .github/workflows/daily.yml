name: Daily X security feed

on:
  schedule:
    # 05:00 and 11:00 JST (20:00 and 02:00 UTC) every day
    - cron: "0 2,20 * * *"
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "初回のみ: Pages に manifest.json が無い状態から開始する"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: daily-feed
  cancel-in-progress: false

jobs:
  # Runs npm dependencies and handles untrusted API output, so it gets read-only access.
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      fetch_outcome: ${{ steps.fetch.outcome }}
      has_pending_archive: ${{ steps.pending.outputs.has_pending }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "26"
          cache: true

      - run: vp test

      - name: Restore unarchived snapshots from Pages
        run: vp run restore
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          BOOTSTRAP: ${{ inputs.bootstrap && 'true' || 'false' }}

      - name: Collect topics from X (xAI x_search)
        id: fetch
        continue-on-error: true
        run: vp run fetch
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_MODEL: ${{ vars.XAI_MODEL }}
          MAX_ITEMS: ${{ vars.MAX_ITEMS }}
          MAX_TURNS: ${{ vars.MAX_TURNS }}
          TRUSTED_HANDLES: ${{ vars.TRUSTED_HANDLES }}
          WINDOW_HOURS: ${{ vars.WINDOW_HOURS }}

      - name: Upload raw API responses for diagnosis
        if: steps.fetch.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xai-responses
          path: .work/debug/
          retention-days: 3
          if-no-files-found: ignore

      - name: Build feed and manifest
        run: vp run build
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      - name: Detect days ready to archive
        id: pending
        run: |
          if compgen -G ".work/archive-pending/*.json" > /dev/null; then
            echo "has_pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_pending=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload pending archive files
        if: steps.pending.outputs.has_pending == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-pending
          path: .work/archive-pending/
          retention-days: 7

      - name: Back up the site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-backup
          path: site/
          retention-days: 90

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  # Holds write access but runs only git: no project code or dependencies.
  # Snapshots are dropped from Pages only by a later run, after it sees them here in git.
  archive:
    needs: collect
    if: needs.collect.outputs.has_pending_archive == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: archive-pending
          path: ${{ runner.temp }}/archive-pending

      - name: Commit finalized days
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PENDING: ${{ runner.temp }}/archive-pending
        run: |
          set -euo pipefail
          mkdir -p archive
          for f in "$PENDING"/*.json; do
            name=$(basename "$f")
            [[ "$name" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}\.json$ ]] || { echo "::error::unexpected file $name"; exit 1; }
            if [ -e "archive/$name" ]; then
              cmp -s "$f" "archive/$name" || { echo "::error::archive/$name already exists with different content"; exit 1; }
            else
              cp "$f" "archive/$name"
            fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive
          if git diff --cached --quiet; then
            echo "nothing new to archive"
            exit 0
          fi
          git commit -m "archive: $(ls "$PENDING" | sed 's/\.json$//' | paste -sd ' ')"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          for attempt in 1 2 3; do
            if git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
              push "https://github.com/${REPO}.git" HEAD:main; then
              exit 0
            fi
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
              pull --rebase "https://github.com/${REPO}.git" main
          done
          exit 1

  # Safe to publish whether or not archiving succeeded: unarchived days stay on Pages.
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  report:
    needs: [collect, archive, deploy]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail the run if collection or archiving failed
        if: needs.collect.outputs.fetch_outcome != 'success' || needs.archive.result == 'failure' || needs.deploy.result != 'success'
        env:
          FETCH: ${{ needs.collect.outputs.fetch_outcome }}
          ARCHIVE: ${{ needs.archive.result }}
          DEPLOY: ${{ needs.deploy.result }}
        run: |
          echo "::error::fetch=${FETCH} archive=${ARCHIVE} deploy=${DEPLOY}. See the job logs."
          exit 1
