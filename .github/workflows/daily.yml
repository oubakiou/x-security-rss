name: Daily X security feed

on:
  schedule:
    # 09:00 JST (00:00 UTC) every day
    - cron: "0 0 * * *"
  workflow_dispatch:

# Least privilege by default; each job opts in to what it needs.
permissions: {}

concurrency:
  group: daily-feed
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      fetch_outcome: ${{ steps.fetch.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "26"
          cache: true

      - run: vp test

      - name: Collect topics from X (xAI x_search)
        id: fetch
        continue-on-error: true
        run: vp run fetch
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_MODEL: ${{ vars.XAI_MODEL }}
          MAX_ITEMS: ${{ vars.MAX_ITEMS }}
          MAX_TURNS: ${{ vars.MAX_TURNS }}
          TRUSTED_HANDLES: ${{ vars.TRUSTED_HANDLES }}

      - name: Build feed
        run: vp run build
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      - name: Commit collected data
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.fetch.outcome }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no data changes"
            exit 0
          fi
          git commit -m "data: $(date -u +%F) ${OUTCOME}"
          # Credentials are supplied only for this push (not persisted by checkout).
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            push "https://github.com/${REPO}.git" HEAD:main

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  report:
    needs: [collect, deploy]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail the run if collection failed
        if: needs.collect.outputs.fetch_outcome != 'success'
        env:
          OUTCOME: ${{ needs.collect.outputs.fetch_outcome }}
        run: |
          echo "::error::Collection failed (outcome: ${OUTCOME}). See the collect job log and data/status.json."
          exit 1
